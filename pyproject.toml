[project]
name = "emporio-da-musica"
version = "0.1.0"
description = "Customer-service agent for the Empório da Música music store, with a NiceGUI storefront"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.18,<4",
    "pypdfium2>=5.14.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP"]
ignore = ["E701"]  # one-line `case` arms are intentional
